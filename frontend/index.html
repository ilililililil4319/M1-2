<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>네이버 재무건전성 분석 AI 비서</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <div class="app-header-row">
    <div>
      <h1>네이버 재무건전성 분석 AI 비서</h1>
      <p class="subtitle">온라인 셀러를 위한 데이터 기반 입점 판단 도구</p>
    </div>
    <button id="theme-toggle-btn" class="theme-toggle" title="다크모드 전환" aria-label="다크모드 전환">🌙</button>
  </div>
</header>

<nav class="tab-nav">
  <button class="tab-btn active" data-tab="chat">채팅</button>
  <button class="tab-btn" data-tab="data">데이터 관리</button>
  <button class="tab-btn" data-tab="history">대화 기록</button>
  <button class="tab-btn" data-tab="summary">요약 표시</button>
</nav>

<main class="app-main">

  <!-- 1. 채팅 화면 -->
  <section id="tab-chat" class="tab-panel active">
    <div class="chat-container">
      <div id="chat-messages" class="chat-messages">
        <div class="chat-msg assistant">
          안녕하세요! 네이버 재무 데이터에 대해 궁금한 점을 물어보세요.
          (예: "최근 부채비율 추세 어때?", "영업이익 흐름 요약해줘")
        </div>
      </div>
      <form id="chat-form" class="chat-input-row">
        <input type="text" id="chat-input" placeholder="질문을 입력하세요..." autocomplete="off" required>
        <button type="submit" id="chat-send-btn">전송</button>
      </form>
      <p id="chat-status" class="status-text"></p>
    </div>
  </section>

  <!-- 2. 데이터 관리 화면 -->
  <section id="tab-data" class="tab-panel">
    <div class="panel-card">
      <h2>데이터 추가</h2>
      <form id="data-form" class="data-form">
        <input type="date" id="data-date" required>
        <input type="number" step="any" id="data-value" placeholder="값" required>
        <input type="text" id="data-memo" placeholder="지표명 (예: 매출액)" required>
        <button type="submit">추가</button>
      </form>
    </div>

    <div class="panel-card">
      <div class="panel-card-header">
        <h2>전체 데이터</h2>
        <div class="header-actions">
          <button id="export-csv-btn" class="btn-secondary">CSV 내보내기</button>
          <button id="export-json-btn" class="btn-secondary">JSON 내보내기</button>
          <button id="data-refresh-btn" class="btn-secondary">새로고침</button>
        </div>
      </div>
      <div class="table-wrap">
        <table id="data-table">
          <thead>
            <tr>
              <th>날짜</th>
              <th>지표명</th>
              <th>값</th>
              <th>관리</th>
            </tr>
          </thead>
          <tbody id="data-table-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- 3. 대화 기록 화면 -->
  <section id="tab-history" class="tab-panel">
    <div class="history-layout">
      <div class="panel-card history-list-card">
        <div class="panel-card-header">
          <h2>대화 목록</h2>
          <button id="history-refresh-btn" class="btn-secondary">새로고침</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </div>
      <div class="panel-card history-detail-card">
        <h2>대화 내용</h2>
        <div id="history-detail" class="history-detail">
          <p class="status-text">왼쪽 목록에서 대화를 선택하세요.</p>
        </div>
      </div>
    </div>
  </section>

  <!-- 4. 요약 표시 화면 -->
  <section id="tab-summary" class="tab-panel">
    <div class="panel-card">
      <div class="panel-card-header">
        <h2>데이터 요약</h2>
        <button id="summary-refresh-btn" class="btn-secondary">새로고침</button>
      </div>
      <div id="summary-meta" class="summary-meta"></div>
    </div>

    <div class="panel-card">
      <h2>매출액 추이</h2>
      <canvas id="summary-chart" height="120"></canvas>
    </div>

    <div class="panel-card">
      <h2>안정성 지표 추이 (부채비율 · 유동비율)</h2>
      <canvas id="stability-chart" height="120"></canvas>
    </div>

    <div class="panel-card">
      <h2>지표별 통계</h2>
      <div class="table-wrap">
        <table id="summary-table">
          <thead>
            <tr>
              <th>지표명</th>
              <th>최신값</th>
              <th>평균</th>
              <th>최대</th>
              <th>최소</th>
              <th>변동성(표준편차)</th>
              <th>개수</th>
            </tr>
          </thead>
          <tbody id="summary-table-body"></tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="app.js"></script>
</body>
</html>
